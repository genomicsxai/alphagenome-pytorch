name: Plugin docs sync

on:
  pull_request:
    paths:
      - 'docs/alphagenome-usage.md'
      - 'plugins/alphagenome/skills/alphagenome-predictions/reference/usage.md'
      - 'scripts/check_usage_metadata.py'
      - 'src/alphagenome_pytorch/data/track_metadata_human.parquet'
      - 'src/alphagenome_pytorch/data/track_metadata_mouse.parquet'
  push:
    branches: [main]

jobs:
  check-usage-guide-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install metadata reader
        run: pip install pandas pyarrow
      - name: Validate vendored guide and metadata facts
        run: python scripts/check_usage_metadata.py
